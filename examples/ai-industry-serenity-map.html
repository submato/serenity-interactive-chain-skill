<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Industry Mindmap</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101112;
      --panel: #17191b;
      --panel-2: #1d2023;
      --text: #e8e8e8;
      --muted: #9aa0a6;
      --faint: #6f767d;
      --line: #2a2f34;
      --accent: #5aa2ff;
      --green: #62c189;
      --amber: #d49a55;
      --red: #d86d6d;
      --blue: #74a9ff;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .page { max-width: 1480px; margin: 0 auto; padding: 18px; }
    header { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 14px; }
    h1, h2, h3 { margin: 0; line-height: 1.25; }
    h1 { font-size: 24px; }
    h2 { font-size: 20px; }
    h3 { font-size: 14px; color: var(--muted); margin-bottom: 4px; }
    p { margin: 0; }
    .muted { color: var(--muted); }
    .faint { color: var(--faint); }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input, select {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 9px;
      padding: 8px 10px;
      font: inherit;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input { min-width: 240px; }
    input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(90,162,255,.18); }
    .tree-row:hover { border-color: var(--accent); }
    button {
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,0));
      background-color: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 12px;
      letter-spacing: .01em;
      transition: border-color .15s ease, background-color .15s ease, color .15s ease, transform .05s ease;
    }
    button:hover { border-color: var(--accent); color: #fff; background-color: #232830; }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(90,162,255,.22); }
    button.btn-primary {
      color: #eaf2ff;
      background-color: rgba(90,162,255,.16);
      border-color: rgba(90,162,255,.45);
    }
    button.btn-primary:hover { background-color: rgba(90,162,255,.26); border-color: var(--accent); color: #fff; }
    button.btn-ghost {
      background: none;
      background-color: transparent;
      color: var(--muted);
      border-color: transparent;
    }
    button.btn-ghost:hover { color: var(--text); border-color: var(--line); background-color: var(--panel-2); }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 14px 0; }
    .stat, .notice, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .stat { padding: 14px; }
    .stat strong { display: block; font-size: 24px; line-height: 1; margin-bottom: 6px; }
    .notice { padding: 12px 14px; background: #17202a; margin-bottom: 14px; }
    .layout { display: grid; grid-template-columns: minmax(360px, 0.9fr) minmax(520px, 1.35fr); gap: 14px; align-items: start; }
    .panel { overflow: hidden; }
    .panel-head {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .panel-body { padding: 12px; }
    .tree { max-height: calc(100vh - 220px); overflow: auto; padding-right: 4px; }
    .tree-row {
      width: 100%;
      text-align: left;
      display: flex;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 9px;
      padding: 7px 9px;
      margin: 4px 0;
    }
    .tree-row.selected { border-color: var(--accent); background: var(--panel-2); }
    .twisty { width: 16px; color: var(--muted); flex: 0 0 auto; }
    .label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pill {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 1px 7px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .success { color: var(--green); border-color: rgba(98,193,137,.35); }
    .warning { color: var(--amber); border-color: rgba(212,154,85,.35); }
    .info { color: var(--blue); border-color: rgba(116,169,255,.35); }
    .danger { color: var(--red); border-color: rgba(216,109,109,.35); }
    .section { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
    .detail-grid { display: grid; gap: 14px; }
    .path { font-size: 12px; color: var(--muted); }
    .title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .pill-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .stock-list { display: grid; gap: 8px; }
    .stock {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #141618;
    }
    .children { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .copy { color: var(--accent); }
    mark { background: rgba(90,162,255,.25); color: var(--text); border-radius: 3px; padding: 0 2px; }
    @media (max-width: 900px) {
      .layout, .stats { grid-template-columns: 1fr; }
      .tree { max-height: none; }
      header { flex-direction: column; }
      input { width: 100%; }
      .actions, .children { grid-template-columns: 1fr; }
    }
  </style>
</head>

      <div>
        <h1>AI Industry Mindmap</h1>
        <p class="muted">独立 HTML 版：可在浏览器打开，文字可选中、复制、搜索，不依赖 Cursor Canvas。</p>
      </div>
      <div class="toolbar">
        <input id="search" placeholder="搜索节点、公司、A股、验证项..." />
        <select id="heatFilter">
          <option value="all">全部热度</option>
          <option value="underfollowed">仍冷门</option>
          <option value="repricing">重估中</option>
          <option value="hot">已拥挤</option>
          <option value="early">过早</option>
        </select>
        <button class="btn-ghost" id="expandAll">全部展开</button>
        <button class="btn-ghost" id="collapseAll">折叠</button>
      </div>
    </header>

    <div class="stats">
      <div class="stat"><strong id="domainCount">-</strong><span class="muted">一级业务域</span></div>
      <div class="stat"><strong id="nodeCount">-</strong><span class="muted">已拆节点</span></div>
      <div class="stat"><strong id="coldCount">-</strong><span class="muted">仍冷门节点</span></div>
      <div class="stat"><strong id="stockCount">-</strong><span class="muted">A股动量样本</span></div>
    </div>

    <div class="notice">
      左侧树用于导航；右侧查看节点详情、A股映射、近期涨跌幅和验证路径。仅作产业链研究，不构成投资建议。
    </div>

    <main class="layout">
      <section class="panel">
        <div class="panel-head">
          <strong>脑图导航</strong>
          <span class="muted" id="visibleCount"></span>
        </div>
        <div class="panel-body">
          <div class="tree" id="tree"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <strong>节点详情</strong>
          <button class="copy" id="copyNode">复制节点摘要</button>
        </div>
        <div class="panel-body detail-grid" id="detail"></div>
      </section>
    </main>

    <section class="panel" id="stockDetailSection" style="margin-top:14px">
      <div class="panel-head">
        <strong>个股分析详情</strong>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <input id="stockSearch" placeholder="搜索股票 / 代码 / 节点 / 结论..." style="min-width:220px" />
          <span class="muted" id="stockCountLabel"></span>
          <button class="btn-ghost" id="stockExpandAll">全部展开</button>
          <button class="btn-ghost" id="stockCollapseAll">全部收起</button>
        </div>
      </div>
      <div class="panel-body" id="stockDetailBody"></div>
    </section>
  </div>

    const tree = [
      { id: "root", label: "AI Industry", kind: "root", summary: "从 agentic AI 需求出发，向上游拆到算力、HBM、CoWoS、互连、电力、液冷和应用分发。", why: "AI 不能只按模型或应用看，要先判断哪些物理层扩不出来，哪些只是拥挤叙事。", companies: "NVIDIA、AMD、TSMC、SK hynix、Micron、Broadcom、Marvell、Vertiv、Eaton、Microsoft、Google、Salesforce。", aShare: "按节点映射：先进封装、光模块、液冷、电力设备、服务器 ODM、应用软件分别验证。", evidence: "reported", heat: "repricing", verify: "先拆业务域，再逐层验证订单、产能、价格、良率、capex 和客户认证。" },
      { id: "D1-ai-factory", parentId: "root", label: "AI Factory / 云端算力", kind: "domain", summary: "训练、后训练、推理和主权 AI 集群，把需求转成 GPU/ASIC rack 和数据中心 capex。", why: "最显眼是 GPU，但真正卡点往往是 HBM、CoWoS、rack 交付和电力并网。", companies: "NVIDIA、AMD、Microsoft、Google、AWS、Meta、Oracle、CoreWeave。", aShare: "工业富联、浪潮信息、中际旭创、新易盛、天孚通信、沪电股份、生益科技。", evidence: "strong", heat: "hot", verify: "看 hyperscaler capex、NVIDIA data center/networking revenue、GPU 租赁价格和集群利用率。" },
      { id: "D1-N1-hbm", parentId: "D1-ai-factory", label: "HBM3e / HBM4", kind: "node", summary: "高带宽内存负责喂饱 GPU/ASIC，决定训练和推理吞吐能否释放。", why: "堆叠层数、TSV、功耗、良率、客户认证和封装协同让 HBM 比普通 DRAM 更难扩。", companies: "SK hynix、Micron、Samsung、Advantest、Teradyne、ASMPT。", aShare: "长电科技、通富微电、华海诚科、雅克科技、精测电子等需逐项验证真实 HBM 敞口。", evidence: "strong", heat: "repricing", verify: "看 HBM4 qualification、合约价、产能 sold-out 程度、NVIDIA/SK hynix 长约和良率。" },
      { id: "D1-N1-S1-stack", parentId: "D1-N1-hbm", label: "堆叠 / TSV / 测试", kind: "subnode", summary: "多层 DRAM 通过 TSV 和先进封装连接，坏 die 和热应力会放大良率损失。", why: "层数越高，良率、散热和测试越难，16-hi 和 HBM4E 会继续抬高门槛。", companies: "SK hynix、Micron、Samsung、Advantest、Teradyne。", aShare: "测试、封装材料和先进封装配套公司需要用客户认证和收入占比验证。", evidence: "inferred", heat: "underfollowed", verify: "核设备订单、材料认证、封测客户和是否进入 HBM 量产链。" },

      { id: "D1-N2-S2-glass-substrate", parentId: "D1-N2-cowos", label: "玻璃基板 / TGV", kind: "subnode", summary: "玻璃基板是下一代先进封装载体路线：用低翘曲、高平整度、低损耗的玻璃 core，配合 TGV 和 RDL 再布线，把 GPU/ASIC、HBM、chiplet 与高密度 I/O 放到更大、更稳定的封装平台上。", role: "给 AI/HPC 超大 package 提供更高互连密度、更低翘曲、更好的尺寸稳定性和高速信号表现。", replaces: "短期更像补充和升级，不是马上全面替代 ABF。", why: "卡点不在有没有玻璃，而在 TGV 深孔成孔、孔壁金属化、填铜空洞、切割微裂纹、RDL 对位、大尺寸热循环可靠性和客户认证。", companies: "Intel、Samsung Electro-Mechanics、TSMC、AT&S、Ibiden、Corning、AGC、LPKF、Onto Innovation。", aShare: "沃格光电/通格微、帝尔激光、大族激光、天承科技、长电科技、通富微电、京东方等。", evidence: "reported", heat: "early", verify: "看 TGV pitch/深宽比、填铜空洞率、微裂纹测试、RDL 层数、玻璃 core 尺寸、客户送样认证。" },
      { id: "D1-N2-S2-L0-advanced-package-demand", parentId: "D1-N2-S2-glass-substrate", label: "L0 超大 AI package 需求", kind: "subnode", summary: "GPU/ASIC、多个 HBM 堆、chiplet、供电网络和高速 I/O 被放进越来越大的封装平台；这是玻璃基板路线的需求源，不是单个制造环节。", role: "解释为什么客户愿意试玻璃路线。京东方A对应的是玻璃基封装载板/面板级封装的远期能力线索：它把显示面板积累的玻璃加工、薄膜、光刻、蚀刻和大板制造能力迁移到半导体封装载板试验线，而不是已经卡住 AI package 量产的现成供应商。", replaces: "不替代制造环节，是需求源。对京东方而言，当前更像“显示面板厂切入玻璃基先进封装”的早期选项，不应等同于 CoWoS 量产产能、ABF 载板有效供给或已认证 AI 客户产能。", why: "如果 AI package 继续变大，传统有机基板和超大硅中介层的成本、翘曲、尺寸和良率压力会给玻璃路线留出窗口。但京东方A目前公开证据显示仍处试验线/送样/技术测试阶段，尚未批量生产和量产营收，良率未达量产水平，因此它是远期候选，不是当下卡点。", companies: "Intel、TSMC、Samsung、AMD、NVIDIA、Broadcom、Marvell、AT&S、Ibiden；京东方需对标的是 Samsung Electro-Mechanics、Intel glass substrate roadmap、Corning 材料协同和面板级封装路线。", aShare: "沃格光电、长电科技、通富微电；京东方A(000725，玻璃基封装载板试验线/面板级封装能力，已送样但未量产，降级为远期能力线索)等。", evidence: "reported", heat: "early", verify: "看 advanced packaging roadmap、AI accelerator package 尺寸、客户样品验证和量产时间表。京东方A单独核：2024年9.93亿元玻璃基封装载板试验线、2025年报“研发及产业化试验线实现工艺通线”、机构调研披露的部分国内客户送样/PoC/技术测试、与康宁合作备忘录、是否出现正式客户订单、量产良率、批量生产、量产营收和 AI/HPC 客户认证。" },

      const walk = pid => childrenOf(pid).forEach(child => { out.push(child.id); walk(child.id); });
      walk(id);
      return out;
    };
    const html = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    let selectedId = localStorage.getItem("ai-map-selected") || "D3-N3-ups-distribution";
    let expanded = JSON.parse(localStorage.getItem("ai-map-expanded") || "null") || {
      root: true, "D1-ai-factory": true, "D1-N1-hbm": true, "D1-N2-cowos": true,
      "D1-N2-S2-glass-substrate": true, "D3-power-cooling": true, "D4-interconnect": true,
      "D4-N1-16t": true, "D4-N2-cpo": true
    };

    const el = {
      tree: document.getElementById("tree"),
      detail: document.getElementById("detail"),
      search: document.getElementById("search"),
      heatFilter: document.getElementById("heatFilter"),
      visibleCount: document.getElementById("visibleCount"),
      copyNode: document.getElementById("copyNode"),
    };

    function matchesFilters(node) {
      const q = el.search.value.trim().toLowerCase();
      const heat = el.heatFilter.value;
      const selfMatch = (!q || searchableText(node).includes(q)) && (heat === "all" || node.heat === heat);
      const childMatch = getDescendants(node.id).some(id => {
        const child = byId.get(id);
        return (!q || searchableText(child).includes(q)) && (heat === "all" || child.heat === heat);
      });
      return selfMatch || childMatch;
    }

    function renderTreeNode(node, depth = 0) {
      if (!matchesFilters(node)) return "";
      const children = childrenOf(node.id).filter(matchesFilters);
      const isExpanded = expanded[node.id] ?? depth < 2;
      const isSelected = selectedId === node.id;
      const row = `
        <button class="tree-row ${isSelected ? "selected" : ""}" data-select="${html(node.id)}" style="padding-left:${10 + depth * 18}px">
          <span class="twisty" data-toggle="${html(node.id)}">${children.length ? (isExpanded ? "v" : ">") : ""}</span>
          <span class="label">${html(node.label)}</span>
          <span class="pill">${kindText[node.kind]}</span>
          <span class="pill ${toneClass(node.heat)}">${heatText[node.heat]}</span>
          <span class="pill ${toneClass(node.evidence)}">${evidenceText[node.evidence]}</span>
        </button>`;
      return row + (children.length && isExpanded ? children.map(child => renderTreeNode(child, depth + 1)).join("") : "");
    }

    function renderTree() {
      const root = byId.get("root");
      el.tree.innerHTML = renderTreeNode(root);
      const visible = tree.filter(matchesFilters).length;
      el.visibleCount.textContent = `${visible} / ${tree.length}`;
    }

    function renderDetail() {
      const node = byId.get(selectedId) || byId.get("root");
      const path = pathTo(node.id).map(n => n.label).join(" / ");
      const children = childrenOf(node.id);
      const stocks = relatedPerformance(node);
      const analyses = stockAnalyses[node.id] || [];
      el.detail.innerHTML = `
        <div>
          <div class="path">${html(path)}</div>
          <div class="title-row">
            <div>
              <div class="faint">${html(node.id)} · ${html(node.kind)}</div>
              <h2>${html(node.label)}</h2>
              <div class="pill-row">
                <span class="pill ${toneClass(node.evidence)}">${evidenceText[node.evidence]}</span>
                <span class="pill ${toneClass(node.heat)}">${heatText[node.heat]}</span>
                <span class="pill ${toneClass(chokeFor(node))}">${chokeText[chokeFor(node)]}</span>
              </div>
            </div>
          </div>
        </div>
        <div class="section"><h3>它是什么</h3><p>${html(node.summary)}</p></div>
        ${node.role ? `<div class="section"><h3>它的作用</h3><p class="muted">${html(node.role)}</p></div>` : ""}
        ${node.replaces ? `<div class="section"><h3>替代 / 补充谁</h3><p class="muted">${html(node.replaces)}</p></div>` : ""}
        <div class="section"><h3>为什么可能卡脖子</h3><p class="muted">${html(node.why)}</p></div>
        <div class="section"><h3>海外 / 私有标的</h3><p>${html(node.companies)}</p></div>
        <div class="section"><h3>A股 / 港股映射</h3><p>${html(node.aShare)}</p></div>
        ${analyses.length ? `<div class="section"><h3>个股映射结论</h3><div class="stock-list">${analyses.map(item => `<div class="stock" style="display:block"><p><strong>${html(item.name)} ${html(item.code)}：</strong>${html(item.judgment)}</p><p class="muted"><strong>对应环节：</strong>${html(item.chainPosition)}</p><p class="muted"><strong>已有证据：</strong>${html(item.evidence)}</p><p class="muted"><strong>缺失证据：</strong>${html(item.missingProof)}</p><p class="muted"><strong>证伪条件：</strong>${html(item.falsification)}</p></div>`).join("")}</div></div>` : ""}
        ${stocks.length ? `<div class="section"><h3>关联A股近期涨跌幅</h3><p class="faint">3个月、半年、1年为最新交易日相对对应日附近收盘价涨跌幅；价格动量只作研究背景。</p><div class="stock-list">${stocks.map(stock => `<div class="stock"><strong>${html(stock.name)} ${html(stock.code)}</strong><span class="pill ${performanceTone(stock.m3)}">3个月 ${html(stock.m3)}</span><span class="pill ${performanceTone(stock.m6)}">半年 ${html(stock.m6)}</span><span class="pill ${performanceTone(stock.y1)}">1年 ${html(stock.y1)}</span><span class="faint">截至 ${html(stock.asOf)} · ${html(stock.source)}</span><button data-stock-action="${html(stock.code)}">分析个股</button>${stockDetails.some(d => d.code === stock.code) ? `<button class="btn-primary" data-jump-detail="${html(stock.code)}">查看分析</button>` : ""}</div>`).join("")}</div></div>` : ""}
        <div class="section"><h3>怎么验证</h3><p class="muted">${html(node.verify)}</p></div>
        <div class="section">
          <h3>研究动作</h3>
          <p class="faint">浏览器版不能直接打开 Cursor 新对话；点击按钮会复制对应任务提示词。</p>
          <div class="actions">
            <button class="btn-primary" data-action="deepen">生成子层</button>
            <button data-action="evidence">补证据</button>
            <button data-action="ashare">找A股映射</button>
            <button data-action="reevaluate">重新评估</button>
          </div>
        </div>
        <div class="section actions">
          <button data-copy="id">复制 ID</button>
          <button data-copy="ashare">复制 A股映射</button>
          <button data-copy="verify">复制验证路径</button>
          <button data-copy="all">复制完整摘要</button>
        </div>
        ${children.length ? `<div class="section"><h3>下一层</h3><div class="children">${children.map(child => `<button data-select="${html(child.id)}">${html(child.label)}</button>`).join("")}</div></div>` : ""}
      `;
    }

    function selectedSummary(mode = "all") {
      const node = byId.get(selectedId) || byId.get("root");
      if (mode === "id") return node.id;
      if (mode === "ashare") return node.aShare;
      if (mode === "verify") return node.verify;
      return `${node.label}\nID: ${node.id}\n路径: ${pathTo(node.id).map(n => n.label).join(" / ")}\n\n它是什么: ${node.summary}\n\n为什么可能卡脖子: ${node.why}\n\n海外/私有标的: ${node.companies}\n\nA股/港股映射: ${node.aShare}\n\n怎么验证: ${node.verify}`;
    }

    function actionPrompt(action) {
      const node = byId.get(selectedId) || byId.get("root");
      const task =
        action === "reevaluate"
          ? "重新评估这个节点：判断它是否仍是当下卡点、市场是否已经定价、证据等级是否需要升降级、A股映射是否仍准确，并更新 ai-industry-serenity-map.html。"
          : action === "deepen"
            ? "继续拆这个节点的下一层子节点，并更新 ai-industry-serenity-map.html。"
            : action === "evidence"
              ? "补充这个节点的证据等级、来源、验证路径和证伪条件，并更新 ai-industry-serenity-map.html。"
              : "补充这个节点的 A股/港股映射、对应强弱和验证方式，并更新 ai-industry-serenity-map.html。";
      return `请继续维护 /Users/wangzhiyang/Documents/serenity-canvases/ai-industry-serenity-map.html。\n目标节点：${node.id}（${node.label}）。\n任务：${task}\n\n当前节点摘要：\n${selectedSummary("all")}`;
    }

    function stockPrompt(code) {
      const node = byId.get(selectedId) || byId.get("root");
      const stock = stockPerformance.find(item => item.code === code);
      if (!stock) return selectedSummary("all");
      return `请继续维护 /Users/wangzhiyang/Documents/serenity-canvases/ai-industry-serenity-map.html。
目标节点：${node.id}（${node.label}）。
目标股票：${stock.name}（${stock.code}）。

任务：分析这只个股与当前节点的产业链映射是否成立，并在必要时更新 HTML。

请重点回答：
1. ${stock.name} 具体对应当前节点的哪个环节，是否真属于卡点，而不是泛概念。
2. 订单、客户、认证、收入占比、产能、毛利率、海外/AI 数据中心暴露有哪些可核证证据。
3. 当前节点的 A股映射是否要保留、降级、升级或改写。
4. 最近 3个月/半年/1年涨跌幅是否需要刷新；当前记录为 3个月 ${stock.m3}、半年 ${stock.m6}、1年 ${stock.y1}，截至 ${stock.asOf}，来源 ${stock.source}。
5. 给出主要证伪条件，以及下一步最该查的 3 个公开来源。

当前节点摘要：
${selectedSummary("all")}`;
    }

    function select(id) {
      selectedId = id;
      localStorage.setItem("ai-map-selected", selectedId);
      const path = pathTo(id);
      path.forEach(node => { expanded[node.id] = true; });
      localStorage.setItem("ai-map-expanded", JSON.stringify(expanded));
      render();
    }

    function render() {
      document.getElementById("domainCount").textContent = childrenOf("root").length;
      document.getElementById("nodeCount").textContent = tree.filter(n => n.kind === "node" || n.kind === "subnode").length;
      document.getElementById("coldCount").textContent = tree.filter(n => n.heat === "underfollowed").length;
      document.getElementById("stockCount").textContent = stockPerformance.length;
      renderTree();
      renderDetail();
    }

    document.addEventListener("click", async event => {
      const toggle = event.target.closest("[data-toggle]");
      if (toggle && toggle.dataset.toggle) {
        event.stopPropagation();
        expanded[toggle.dataset.toggle] = !(expanded[toggle.dataset.toggle] ?? true);
        localStorage.setItem("ai-map-expanded", JSON.stringify(expanded));
        renderTree();
        return;
      }
      const selectTarget = event.target.closest("[data-select]");
      if (selectTarget && selectTarget.dataset.select) {
        select(selectTarget.dataset.select);
        return;
      }
      const copy = event.target.closest("[data-copy]");
      if (copy) {
        await navigator.clipboard.writeText(selectedSummary(copy.dataset.copy));
        copy.textContent = "已复制";
        setTimeout(() => renderDetail(), 800);
      }
      const action = event.target.closest("[data-action]");
      if (action) {
        await navigator.clipboard.writeText(actionPrompt(action.dataset.action));
        action.textContent = "已复制提示词";
        setTimeout(() => renderDetail(), 900);
      }
      const stockAction = event.target.closest("[data-stock-action]");
      if (stockAction) {
        await navigator.clipboard.writeText(stockPrompt(stockAction.dataset.stockAction));
        stockAction.textContent = "已复制个股提示词";
        setTimeout(() => renderDetail(), 900);
      }
      const jumpDetail = event.target.closest("[data-jump-detail]");
      if (jumpDetail) {
        jumpToStockDetail(jumpDetail.dataset.jumpDetail);
      }
    });

    el.search.addEventListener("input", renderTree);
    el.heatFilter.addEventListener("change", renderTree);
    document.getElementById("expandAll").addEventListener("click", () => {
      tree.forEach(node => { expanded[node.id] = true; });
      localStorage.setItem("ai-map-expanded", JSON.stringify(expanded));
      renderTree();
    });
    document.getElementById("collapseAll").addEventListener("click", () => {
      expanded = { root: true };
      localStorage.setItem("ai-map-expanded", JSON.stringify(expanded));
      renderTree();
    });
    const stockDetails = [
      {
        name: "京东方A",
        code: "000725.SZ",
        nodeId: "D1-N2-S2-L0-advanced-package-demand",
        nodeLabel: "L0 超大 AI package 需求",
        path: "AI Industry / AI Factory / 云端算力 / CoWoS / 先进封装 / 玻璃基板 / TGV / L0 超大 AI package 需求",
        conclusion: "保留在该节点，但降级为“玻璃基封装载板 / 面板级封装远期能力线索”，不按当下卡点处理。",
        chainPosition: "它把显示面板积累的玻璃加工、薄膜、光刻、蚀刻和大板制造能力迁移到半导体封装载板试验线，对应玻璃基封装载板 / 面板级封装，而不是已经进入 AI/HPC package 量产供应的现成供应商。",
        evidence: "2024 年投资 9.93 亿元建设玻璃基封装载板试验线；2025 年报披露“研发及产业化试验线实现工艺通线”；机构调研披露已向部分国内客户送样、部分客户通过概念认证并进入技术测试；与康宁签署玻璃基封装载板等方向合作备忘录。",
        missingProof: "缺正式 AI/HPC 客户订单、批量生产、量产营收、量产良率与海外大客户认证；公司公开提示该业务尚未实现批量生产及量产营收，试验线良率未达量产水平。",
        quote: "原 3 个月 +51.3% / 半年 +56.4% / 1 年 +64.6%（截至 2026-06-09）已改为“待复算”——6 月 11 日盘中约 5.83 元，较 6 月 9 日 6.52 元明显回落，需按收盘日线重算。",
        falsification: "若未来 6-12 个月仍无客户认证、良率爬坡、正式订单或量产营收，应继续降级；若长期停留在概念认证/技术测试，说明只是显示面板能力外溢，不构成玻璃基板卡点。",
        nextSources: "① 京东方投资者关系活动记录表与 2025 年报；② 与康宁合作的后续正式协议进展；③ 是否出现 AI/HPC 客户送样→认证→量产营收的公告。"
      }
    ];

    const stockDetailText = item => [item.name, item.code, item.path, item.conclusion, item.chainPosition, item.evidence, item.missingProof, item.quote, item.falsification, item.nextSources].join(" ").toLowerCase();

    function detailPrompt(item, kind) {
      const task = kind === "reevaluate"
        ? `重新评估 ${item.name}(${item.code}) 与该节点的映射：是否仍是远期能力线索还是该升级/降级、证据等级是否变化、量产/客户认证有无新进展。`
        : kind === "drill"
          ? `对 ${item.name}(${item.code}) 在该节点继续下钻：拆出更细的子环节（如玻璃 core、TGV 成孔、填铜、RDL、检测、客户认证），逐项给证据与证伪条件。`
          : `对 ${item.name}(${item.code}) 做交叉验证：用至少 3 类独立来源（公司公告/年报、第三方行业媒体如 TrendForce/集微网/Commercial Times、康宁或同业口径）交叉核对其进展是否被夸大，并与同业（沃格光电、三星电机、Intel glass substrate roadmap）对比定位。`;
      return `请继续维护 /Users/wangzhiyang/Documents/serenity-canvases/ai-industry-serenity-map.html。\n目标节点：${item.nodeId}（${item.nodeLabel}）。\n目标股票：${item.name}（${item.code}）。\n任务：${task}\n完成后更新底部「个股分析详情」对应卡片。`;
    }

    const collapsedDetails = {};

    function renderStockDetails() {
      const q = document.getElementById("stockSearch").value.trim().toLowerCase();
      const list = stockDetails.filter(item => !q || stockDetailText(item).includes(q));
      const body = document.getElementById("stockDetailBody");
      const label = document.getElementById("stockCountLabel");
      label.textContent = `${list.length} / ${stockDetails.length}`;
      if (!list.length) {
        body.innerHTML = `<p class="muted">没有匹配的个股分析。</p>`;
        return;
      }
      body.innerHTML = list.map(item => {
        const collapsed = !!collapsedDetails[item.code];
        return `
        <div class="section" data-detail-card="${html(item.code)}">
          <div class="title-row">
            <div>
              <h3 style="margin-bottom:2px">${html(item.name)} ${html(item.code)}</h3>
              <div class="path">${html(item.path)}</div>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button data-detail-action="reevaluate" data-detail-code="${html(item.code)}">重新评估</button>
              <button data-detail-action="drill" data-detail-code="${html(item.code)}">下钻</button>
              <button class="btn-primary" data-detail-action="cross" data-detail-code="${html(item.code)}">交叉验证</button>
              <button class="btn-ghost" data-detail-toggle="${html(item.code)}">${collapsed ? "展开" : "收起"}</button>
            </div>
          </div>
          ${collapsed ? "" : `<div style="margin-top:8px">
            <p style="margin-bottom:6px"><strong>结论：</strong>${html(item.conclusion)}</p>
            <p class="muted" style="margin-bottom:6px"><strong>对应环节：</strong>${html(item.chainPosition)}</p>
            <p class="muted" style="margin-bottom:6px"><strong>已有证据：</strong>${html(item.evidence)}</p>
            <p class="muted" style="margin-bottom:6px"><strong>缺失证据：</strong>${html(item.missingProof)}</p>
            <p class="muted" style="margin-bottom:6px"><strong>行情：</strong>${html(item.quote)}</p>
            <p class="muted" style="margin-bottom:6px"><strong>证伪条件：</strong>${html(item.falsification)}</p>
            <p class="muted"><strong>下一步查 3 个来源：</strong>${html(item.nextSources)}</p>
          </div>`}
        </div>`;
      }).join("");
    }

    function jumpToStockDetail(code) {
      document.getElementById("stockSearch").value = "";
      collapsedDetails[code] = false;
      renderStockDetails();
      const card = document.querySelector(`[data-detail-card="${code}"]`);
      if (card) {
        card.scrollIntoView({ behavior: "smooth", block: "center" });
        const prev = card.style.borderColor;
        card.style.borderTop = "2px solid var(--accent)";
        setTimeout(() => { card.style.borderTop = prev; }, 1500);
      } else {
        document.getElementById("stockDetailSection").scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    document.getElementById("stockSearch").addEventListener("input", renderStockDetails);
    document.getElementById("stockExpandAll").addEventListener("click", () => {
      stockDetails.forEach(item => { collapsedDetails[item.code] = false; });
      renderStockDetails();
    });
    document.getElementById("stockCollapseAll").addEventListener("click", () => {
      stockDetails.forEach(item => { collapsedDetails[item.code] = true; });
      renderStockDetails();
    });
    document.getElementById("stockDetailBody").addEventListener("click", async (event) => {
      const toggle = event.target.closest("[data-detail-toggle]");
      if (toggle) {
        const code = toggle.dataset.detailToggle;
        collapsedDetails[code] = !collapsedDetails[code];
        renderStockDetails();
        return;
      }
      const btn = event.target.closest("[data-detail-action]");
      if (!btn) return;
      const item = stockDetails.find(it => it.code === btn.dataset.detailCode);
      if (!item) return;
      await navigator.clipboard.writeText(detailPrompt(item, btn.dataset.detailAction));
      const original = btn.textContent;
      btn.textContent = "已复制提示词";
      setTimeout(() => { btn.textContent = original; }, 900);
    });
    renderStockDetails();
    el.copyNode.addEventListener("click", async () => {
      await navigator.clipboard.writeText(selectedSummary("all"));
      el.copyNode.textContent = "已复制";
      setTimeout(() => { el.copyNode.textContent = "复制节点摘要"; }, 900);
    });

    render();
  </script>
</body>
</html>
