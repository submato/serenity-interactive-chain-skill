<script id="data" type="application/json">{"tree":[{"id":"root","label":"Musk Ecosystem","kind":"root","summary":"一组共享资本、能源、算力、制造和数据的实体系统。","why":"不能按单一公司看，要先拆 SpaceX、Tesla/Optimus、xAI、Neuralink、Boring 和跨域芯片能源底座。","companies":"Tesla、SpaceX、xAI、Neuralink、The Boring Company。","aShare":"需按业务域映射，不能直接买一个“马斯克概念”。","evidence":"reported","heat":"repricing","verify":"先用业务域拆解，再逐层验证供应链节点。"},{"id":"D1-starlink","parentId":"root","label":"Starlink / 卫星互联网","kind":"domain","summary":"低轨宽带从住宅终端扩到航空、海事、DTC 手机直连、网关和星间光网。","why":"仍是当下产业链卡点，但卡点已经从“有没有星链”转到三处：低成本相控阵终端的极限量产、DTC 专用频谱与手机直连载荷、E-band/V/W-band 网关容量。","companies":"SpaceX/Starlink、STMicroelectronics、Filtronic、Compeq、WNC、EchoStar、Muon Space、Starcloud。","aShare":"长电科技、通富微电、三安光电、沪电股份、生益科技、信维通信、国博电子、通宇通讯；光库科技只能按星间光链路器件线索看，不能等同 Starlink 直接供应确认。","evidence":"strong","heat":"repricing","verify":"优先看三条线：1）ST/SpaceX 是否继续披露 BiCMOS、PLP 和终端日产能；2）EchoStar 频谱交易、FCC/各国监管与 DTC 商用节奏；3）E-band 网关许可、Filtronic GaN E-band 交付和 Bastrop 终端产能。","source":"重新评估：Starlink 域证据上调/维持强证据。ST 与 SpaceX 公开披露十年合作、BiCMOS 相控阵、PLP 交付和每天数百万颗芯片交付；Filtronic 2025 年披露 SpaceX 最大单笔 GaN E-band 订单；Ofcom/ISED/FCC 文件显示 Starlink 正在补 E-band 网关与 DTC 频谱；SpaceX/EchoStar 2025-2026 年交易把 DTC 从运营商借频谱推进到专用频谱路线。","falsification":"证伪条件：Starship/V3 继续延迟导致 DTC 和更高容量卫星推迟；专用频谱无法在主要市场落地；网关频谱受限导致容量改善不明显；SpaceX 进一步内制终端、射频和光链路，使外部供应商只剩低毛利代工；A股映射公司不能用公告、收入占比或客户验证证明与卫星互联网相关。"},{"id":"D1-N1-stm-bicmos","parentId":"D1-starlink","label":"相控阵芯片","kind":"node","summary":"ST SiGe BiCMOS 和 PLP 支撑 Starlink 终端电子扫描相控阵，核心是低成本高频前端的规模化。","why":"这是 Starlink 最硬的外部证据之一，但市场已知道 ST 是关键供应商，研究重点从“是否供应”转为“下一代终端、DTC/V3 是否继续外部放量”。","companies":"STMicroelectronics、SpaceX 自研 RF/天线团队、封测/PLP 生态。","aShare":"长电科技、通富微电可作先进封装/测试映射；卓胜微、唯捷创芯更偏手机射频，不宜直接当 Starlink 相控阵对标。","evidence":"strong","heat":"hot","verify":"追 ST 年报/新闻稿中的 LEO 收入、BiCMOS55/PLP 扩产、每天芯片交付量、Starlink 终端日产能和下一代终端拆解。","source":"证据等级：强证据。ST 官网、SEC 附件新闻稿和行业媒体均披露 ST BiCMOS 被用于 Starlink 相控阵，并披露 France/Italy 设计、France fab、Malaysia/Malta 封测、PLP 工艺和高交付 run-rate。","falsification":"若 SpaceX 在下一代终端中转向更多自研/其他 foundry，或 Starlink 终端增长不再拉动 ST LEO 相关收入，则该节点从已定价强供应链节点降级为历史供应关系。"},{"id":"D1-N2-rf-gan","parentId":"D1-starlink","label":"RF / GaN 功放","kind":"node","summary":"网关、星上链路和 DTC 升级都需要更高功率、更高效率的 E-band/毫米波功放与收发模块。","why":"Filtronic 的 SpaceX GaN E-band 订单把这个节点从推断变成可验证订单；但产品交付在 FY2027-2028，仍要防止市场提前透支。","companies":"Filtronic、Qorvo、Coherent、Sumitomo Electric、SpaceX 自研射频团队。","aShare":"三安光电、铖昌科技、国博电子、臻镭科技；其中三安偏 GaN/化合物半导体平台，铖昌/国博偏相控阵与军用射频，和 Starlink 直接供应关系需单独核实。","evidence":"strong","heat":"repricing","verify":"看 Filtronic 是否继续拿 SpaceX 扩单、E-band GaN 交付是否按 FY2027 起量、毛利率是否保持、SpaceX 网关/DTC 是否使用更高频段。","source":"证据等级：强证据。Filtronic 2025 年公告和多家媒体披露 SpaceX £47.3m / $62.5m GaN E-band SSPA 订单，明确用于支持 Starlink constellation，且首批量产交付在 FY2027。","falsification":"若订单只是一次性开发采购、SpaceX 后续内制或切换供应商，或 E-band 网关扩容受监管/部署限制，则 GaN 节点从当前候选卡点降级为单一供应商事件。"},{"id":"D1-N3-optical-isl","parentId":"D1-starlink","label":"星间激光 ISL","kind":"node","summary":"Starlink 卫星之间以及第三方航天器接入 Starlink mesh 的光链路终端；它和 RF 波束成形 IC 同属空间通信，但不是同一个直接卡点。","why":"技术重要性仍高，但 SpaceX 自研和外售 mini laser terminal 后，外部纯 ISL 供应商可能被挤压；RF/Ka-band beamforming IC 更应该放到相控阵终端、卫星载荷、DTC 和网关链条，而不是直接归入 laser ISL。","companies":"SpaceX、Muon Space、Starcloud、Vast、CACI/Mynaric、Tesat、Sony Space Communications；RF/multi-orbit beamforming IC 对照为 Analog Devices、Sivers/ALL.SPACE、Qorvo 等。","aShare":"光库科技只能作为宇航级光器件/薄膜铌酸锂线索；中际旭创、新易盛、天孚通信等地面光模块不是 Starlink ISL 直接对标。波束成形 IC 的 A股映射应优先看国博电子、铖昌科技、臻镭科技、三安光电等射频/相控阵链条，并单独核客户与频段。","evidence":"strong","heat":"hot","verify":"分两条验证：1）ISL 看 Muon、Vast、Starcloud 等外部客户实飞、SpaceX mini laser terminal 是否形成标准接口、光器件公司是否有可披露宇航级收入；2）波束成形 IC 看 Ka/Ku/E-band 相控阵、TTD/phase shifter、卫星载荷或多轨终端订单，避免把 RF ESA 需求误并到 laser ISL。","source":"证据等级：强证据。Starlink 技术页把 optical space lasers 与 Ku/Ka/E-band phased array antennas 分开描述；PCMag 对 Starlink laser system 的报道强调其通过 optical laser link 做空间 mesh；Analog Devices 和 Sivers/ALL.SPACE 信息显示 beamforming IC 主要服务 LEO/multi-orbit ESA/Ka-band 通信平台。因此二者有关联，但在产业链上应拆成 optical ISL 与 RF beamforming 两层。","falsification":"若未来 SpaceX 或第三方 laser terminal 公开采用光相控阵/硅光 OPA beamforming IC 并进入批量，则 beamforming IC 可重新并入 ISL 子层；在此之前，把普通 RF beamforming IC 直接当作星间激光 ISL 供应链会高估相关性。"},{"id":"D1-N3-S1-beamforming-boundary","parentId":"D1-N3-optical-isl","label":"边界：波束成形 IC","kind":"subnode","summary":"LEO/多轨卫星通信确实需要 beamforming IC，但主场是 RF 电子扫描阵列，不是 Starlink 当前 laser ISL。","why":"波束成形 IC 控制相位、幅度或真时延来扫 Ka/Ku/E-band 波束，解决卫星高速移动、多波束、多轨切换和宽带 beam squint；laser ISL 的核心则是光终端、光收发、ATP 指向跟踪和空间级可靠性。","companies":"Analog Devices、Sivers Semiconductors/ALL.SPACE、Qorvo、SpaceX RF/antenna team、STMicroelectronics。","aShare":"更合理映射到国博电子、铖昌科技、臻镭科技、三安光电、长电科技/通富微电等相控阵、射频前端、化合物半导体和封测链条；不应作为光库科技或地面光模块公司的直接 ISL 证据。","evidence":"reported","heat":"repricing","verify":"先问产品工作频段和链路位置：如果是 Ka/Ku/E-band ESA、payload、gateway 或 multi-orbit terminal，归入 D1-N1/D1-N2/D1-N4/D1-N6；只有明确是 optical phased array、硅光 OPA 或 laser terminal 内部光束控制芯片，才回到 D1-N3。","source":"Analog Devices 将 multibeam beamforming IC 定位为 LEO payload phased array antenna 的关键模块；Sivers/ALL.SPACE 披露 Ka-band BFIC 用于 multi-orbit satellite communications terminal；Starlink 官方同时列出 optical space lasers 与 Ku/Ka/E-band phased arrays，说明它们是同一通信系统的不同物理层。","falsification":"若所谓 beamforming IC 只是地面 5G/手机射频或普通民用通信芯片，缺少空间级、Ka/Ku/E-band、ESA、多轨终端或卫星载荷证据，则不能映射到 Starlink/LEO 多轨通信。"},{"id":"D1-N4-gateway-eband","parentId":"D1-starlink","label":"E-band 网关 / 地面站","kind":"node","summary":"把卫星流量接回互联网的网关站点、E/V/W-band 天线、功放、频谱许可和站址协调。","why":"用户数和流量增长后，容量瓶颈不只在天上，也在地面回传；监管文件已经明确 Starlink 在英国、加拿大等地为容量约束申请 E-band 网关授权。","companies":"SpaceX/Starlink、Filtronic、Viasat 地面站生态、天线/射频/站址服务商。","aShare":"通宇通讯、盛路通信、国博电子、铖昌科技可作地面站/相控阵/射频映射；但需核公告客户和频段能力，不能仅按卫星互联网概念泛化。","evidence":"strong","heat":"underfollowed","verify":"看 Ofcom、ISED、FCC 网关许可，Starlink 新网关站数量，E/V/W-band 天线升级，Filtronic GaN E-band 交付和地面站容量指标。","source":"新增漏掉节点。Ofcom 2025 年咨询/决定、ISED 2026 年决定和 FCC 文件均指向 Starlink 为容量约束申请高频网关频谱；这是比普通终端叙事更接近现实容量约束的一层。","falsification":"若星间激光和更多卫星显著减少地面网关约束，或监管长期不给 E/V/W-band 授权，则该节点从当下卡点降级为地区性约束。"},{"id":"D1-N5-terminal-pcb-odm","parentId":"D1-starlink","label":"终端制造 / PCB / CCL","kind":"node","summary":"Starlink 用户终端的 PCB、PCBA、天线模组、路由器/网通代工和海外制造迁移。","why":"终端日产能已经到万台级，成本、良率和地缘风险变成现实约束；SpaceX 要求台湾供应链向越南等地迁移说明供应链韧性本身是卡点。","companies":"Wistron NeWeb、Compeq、Universal Microwave、Shenmao、SpaceX Bastrop 工厂。","aShare":"沪电股份、生益科技、深南电路、鹏鼎控股、胜宏科技、信维通信；沪电/生益更偏高频高速 PCB/CCL 映射，信维通信更偏卫星通信终端组件线索，需用公告和收入占比确认。","evidence":"reported","heat":"repricing","verify":"看 Compeq LEO 收入占比、WNC 越南产能、SpaceX Bastrop 终端/PCB 内制比例、A股公司卫星通信收入和客户集中度。","source":"新增漏掉节点。Reuters/CNBC、DigiTimes 与台湾供应链报道显示 WNC、Compeq 等与 Starlink 终端和地面设备相关，且 SpaceX 推动部分台湾供应链外迁；A股映射更偏间接材料/PCB能力，不是直供确认。","falsification":"若 SpaceX Bastrop 自制 PCB/PCBA 比例继续提高，或台湾/中国供应链只承担低壁垒代工，则 PCB/CCL 从卡点变成低毛利制造环节。"},{"id":"D1-N6-dtc-spectrum-payload","parentId":"D1-starlink","label":"DTC 频谱 / 手机直连载荷","kind":"node","summary":"用普通手机直连低轨卫星，需要专用/合作频谱、更大相控阵载荷、3GPP NTN 协议和运营商接入。","why":"这是 Starlink 从宽带终端走向移动网络的增量卡点；EchoStar 频谱交易和 FCC 批准把瓶颈从概念推进到频谱、监管、载荷和 Starship/V3 部署节奏。","companies":"SpaceX/Starlink、EchoStar/Boost、T-Mobile、Deutsche Telekom、KDDI、AST SpaceMobile。","aShare":"信维通信、国博电子、通宇通讯、华力创通、海格通信、震有科技可作为国内卫星通信/终端/射频映射；与 Starlink 直接供应关系弱，更多是国内 DTC/卫星互联网比较样本。","evidence":"strong","heat":"repricing","verify":"看 FCC 对 EchoStar 频谱转让的最终条件、2027 年交割、Starlink Mobile 用户数、DTC 卫星发射节奏、运营商商业发布和手机端兼容频段。","source":"新增漏掉节点。EchoStar 2025 年公告、FCC 2026 年批准和 SpaceNews 等报道显示 SpaceX 获得约 65MHz 全国性频谱并与 Boost/T-Mobile 等形成 DTC 商业路径；这比原图只看终端/ISL更贴近下一阶段增量。","falsification":"若频谱交割延后、DTC 只能停留在短信/低速数据、Starship/V3 延迟导致大载荷无法部署，或 AST 等竞争者在运营商侧更快落地，则该节点降级。"},{"id":"D2-starship","parentId":"root","label":"SpaceX / Starship","kind":"domain","summary":"Falcon、Starship、Raptor、Stage 0 发射基础设施。","why":"SpaceX 垂直整合强，外部弹性主要在高温材料、低温系统和制造设备。","companies":"SpaceX、Sphere、ATI、Linde、Chart、Velo3D。","aShare":"钢研高纳、抚顺特钢、杭氧股份、中泰股份、铂力特。","evidence":"reported","heat":"underfollowed","verify":"看 Raptor 3 批产、Starbase 扩建、发射频次许可。"},{"id":"D2-N1-raptor-alloy","parentId":"D2-starship","label":"Raptor 特种合金"," 克相关叙事从人物标签还原为可验证的供应链地图：卫星互联网需要终端、射频、网关和频谱；Starship 需要发动机材料和低温发射场；Optimus 需要执行器和传感器；xAI 需要电力、液冷和整柜交付。","replaces":"它替代的是按单一上市公司或单一热点去看 Musk 生态的方式。这里不假设所有 A 股映射都直接供货，而是区分直接订单、可比供应链、能力映射和远期选项。"},"D1-starlink":{"summary":"Starlink / 卫星互联网是 SpaceX 的低轨通信网络，从住宅宽带终端扩展到航空、海事、军政、DTC 手机直连、地面网关和星间光链路。它不是传统 GEO 卫星运营商，也不是单纯发射业务，而是一个由卫星制造、终端制造、频谱、地面站、软件网络和发射节奏共同决定容量的通信平台。","role":"它的作用是把 SpaceX 的发射能力转成经常性通信收入，并为 DTC、国防、远程连接和边缘算力提供全球覆盖网络。","replaces":"它部分替代偏远地区地面宽带、海事航空卫星通信和部分移动网络盲区补覆盖，但不会全面替代城市光纤或传统移动网络。"},"D1-N1-stm-bicmos":{"summary":"相控阵芯片是 Starlink 用户终端电子扫描天线里的关键射频/毫米波芯片，负责让终端不用机械转动也能追踪高速移动的低轨卫星。ST 的 SiGe BiCMOS 与 PLP 供应链说明这个节点不是普通手机射频芯片，而是面向大规模低成本卫星终端的高频前端与封装平台。","role":"它的作用是降低终端成本、提高波束扫描速度和规模化制造良率，让 Starlink 可以把相控阵终端从工程产品变成消费级/企业级大批量硬件。","replaces":"它替代传统机械指向天线在低轨宽带终端里的位置；但不替代功放、PCB、整机代工和卫星载荷，只是终端相控阵里的核心芯片层。"},"D1-N2-rf-gan":{"summary":"RF / GaN 功放是 Starlink 网关、卫星载荷和高频链路中把射频信号放大到可用功率的关键器件，尤其在 E-band/毫米波频段重要。它不是普通低频通信功放，而是要求高效率、高线性度、高可靠性和空间/地面站级别交付能力的化合物半导体链条。","role":"它的作用是扩大链路预算、提升网关和载荷容量，并支撑 DTC、E-band 回传和下一代高容量卫星网络。","replaces":"GaN 在高功率高频场景中部分替代 LDMOS、GaAs 或低效率方案，但短期更像高频高容量链路的升级路线，不是所有射频前端的统一替代品。"},"D1-N3-optical-isl":{"summary":"星间激光 ISL 是 Starlink 卫星之间用光通信建立空间 mesh 的链路终端，包括激光收发、光学组件、ATP 指向捕获跟踪和空间级可靠性。它不是地面 800G 光模块，也不是 RF 波束成形 IC；它的位置在卫星之间的空间骨干网，而不是用户终端到卫星的无线接入链路。","role":"它的作用是减少对地面网关的依赖，让卫星流量可以在轨道上跨区域转发，提高极地、海洋、战区和网关稀缺区域的服务能力。","replaces":"它部分替代必须就近落地到地面网关的回传路径，但不能替代用户终端、地面站和 DTC 频谱。"},"D1-N3-S1-beamforming-boundary":{"summary":"边界：波束成形 IC 是用来控制 RF 相控阵天线相位、幅度或真时延的芯片层，主场在 Ku/Ka/E-band 电子扫描阵列、卫星载荷和多轨终端。它容易和星间激光 ISL 混淆，但 laser ISL 的核心是光终端和指向跟踪，不是普通 RF beamforming。","role":"它的作用是帮研究者把 RF 卫星通信链条和 optical ISL 链条分开，避免把所有“波束控制”都归入光链路。","replaces":"它替代机械转动天线或低集成度相控阵控制方案，但不替代激光通信终端。"},"D1-N4-gateway-eband":{"summary":"E-band 网关 / 地面站是把 Starlink 卫星网络流量接回互联网骨干网的地面容量层，包括高频天线、功放、频谱许可、站址、光纤回传和监管协调。它不是用户终端，也不是星间链路；它连接卫星网络和地面互联网，是容量扩张时容易被忽视的物理出口。","role":"它的作用是扩大区域吞吐、缓解热门地区容量瓶颈，并让更多卫星和用户终端的流量能稳定落地。","replaces":"它补充星间激光 ISL，并部分替代低频低容量网关方案；但在很多区域仍需要和 ISL、地面光纤、频谱许可共同工作。"},"D1-N5-terminal-pcb-odm":{"summary":"终端制造 / PCB / CCL 是 Starlink 用户终端从相控阵芯片、天线、PCB、路由器到整机组装的量产链条。它不是单一芯片环节，而是把射频设计、板材、PCBA、整机代工、海外产能迁移和成本下降结合在一起的制造平台。","role":"它的作用是把 Starlink 终端做到足够便宜、足够稳定、足够大规模，支撑住宅、车载、海事和企业市场扩张。","replaces":"它替代传统卫星终端小批量高成本制造模式，但不替代上游 RF 芯片、GaN 功放或 SpaceX 自有终端设计。"},"D1-N6-dtc-spectrum-payload":{"summary":"DTC 频谱 / 手机直连载荷是 Starlink 从专用终端宽带进入普通手机直连卫星通信的增量路线，包括专用频谱、运营商合作、3GPP NTN、星上大天线和监管批准。它不是普通 Starlink dish 业务，也不是单纯卫星短信功能；它把卫星网络接到移动通信生态里。","role":"它的作用是把 Starlink 从固定宽带扩展到移动网络补盲和全球低速/中速连接，扩大地址市场和运营商合作空间。","replaces":"它补充地面移动网络覆盖盲区，部分替代偏远地区应急通信设备，但不会替代城市蜂窝网络。"},"D2-starship":{"summary":"SpaceX / Starship 是 SpaceX 的重型可复用发射系统和发射基础设施域，包含 Starship 飞船、Super Heavy booster、Raptor 发动机、Stage 0、推进剂系统和发射场。它不是 Falcon 9 的线性升级，而是把低成本入轨、星链 V3、月火任务和大规模轨道运输放到同一个制造系统里。","role":"它的作用是把 SpaceX 的发射频次和单次运力提升一个数量级，为 Starlink 大卫星、深空任务和商业重载创造成本优势。","replaces":"它长期部分替代 Falcon 9/Falcon Heavy 在大载荷和高频星链发射中的角色，但短期仍与 Falcon 系列并行。"},"D2-N1-raptor-alloy":{"summary":"Raptor 特种合金是高室压全流量分级燃烧甲烷发动机里的高温、高压、富氧环境材料层，涉及涡轮泵、燃烧室、喷管、管路和热端结构。它不是普通航空钢材，而是要在极端热循环、氧化和振动环境中保持寿命和一致性的高端合金/制造链条。","role":"它的作用是支撑 Raptor 批量生产、复用寿命和可靠性，让 Starship 发射频次不被发动机热端材料和制造良率限制。","replaces":"它升级传统液体火箭发动机材料体系，但不替代低温系统、发动机设计或总装测试。"},"D2-N2-stage0-cryo":{"summary":"Stage 0 低温系统是 Starship 发射场侧的液氧、液甲烷、储罐、泵阀、快速连接器、空分和加注回收系统。它不是火箭本体，而是让火箭能够高频发射、快速周转和安全补给的地面工业系统。","role":"它的作用是把发射从一次性工程活动变成类似机场周转的基础设施能力。","replaces":"它替代传统低频发射场的慢速加注和一次性保障逻辑，但不替代发动机和箭体制造。"},"D4-optimus":{"summary":"Tesla / Optimus 是 Tesla 把车端 AI、制造工程、电机电控和供应链能力迁移到人形机器人的业务域。它不是普通工业机器人，也不是纯软件 agent，而是由执行器、传动、传感器、灵巧手、电池、控制板和视觉模型组成的具身智能平台。","role":"它的作用是把 Tesla 的工厂自动化经验和 AI 控制能力转成可规模制造的人形劳动力平台。","replaces":"它长期可能替代部分重复性人工和专用工装机器人，短期更像在 Tesla 内部工厂场景先试用的自动化补充。"},"D4-N1-actuator":{"summary":"执行器总成是 Optimus 关节的模块化动力单元，通常把电机、减速器、丝杠/传动、传感器、控制板和结构件集成到一个可装配关节里。它不是单独电机，也不是单独减速器，而是决定机器人力量、速度、成本、维护和量产节拍的系统件。","role":"它的作用是把控制算法转成可重复、可承载、可安全工作的身体运动。","replaces":"它替代传统工业机器人中更大、更重、更专用的关节模组，目标是走向低成本、高一致性的人形机器人关节平台。"},"D4-N2-harmonic":{"summary":"谐波减速器是人形机器人旋转关节中常见的高减速比、低背隙传动部件，核心由波发生器、柔轮和刚轮组成。它不是普通齿轮箱，难点在薄壁柔轮疲劳寿命、加工一致性、噪声、背隙和批量良率。","role":"它的作用是在小体积内提供高扭矩和精密定位，是肩、肘、腕等旋转关节能否稳定工作的关键。","replaces":"它在部分精密旋转关节中替代行星齿轮、摆线或直驱方案，但不是所有关节的唯一选择。"},"D4-N3-roller-screw":{"summary":"行星滚柱丝杠是把电机旋转运动转成高承载线性运动的精密传动件，适合髋、膝等需要大推力的线性执行器。它不是普通滚珠丝杠，承载、寿命、加工精度、热处理和成本要求更高。","role":"它的作用是在人形机器人高负载关节中提供紧凑、高效率、长寿命的线性驱动。","replaces":"它部分替代液压缸、普通丝杠或低承载直线传动方案，但是否采用取决于 Tesla 最终关节架构。"},"D4-N4-sensors":{"summary":"力控 / 触觉传感是人形机器人从演示动作进入真实任务所需的感知层，覆盖关节力矩、六维力、足底压力、触觉皮肤、IMU 和视觉。它不是摄像头的同义词，而是让机器人知道自己接触了什么、用了多大力、是否打滑或碰撞的反馈系统。","role":"它的作用是让 Optimus 能安全抓取、装配、行走和适应非结构化工厂环境。","replaces":"它替代开环位置控制和简单限位传感，使机器人从预编程动作走向力控闭环。"},"D5-xai":{"summary":"xAI / AI 工厂是 Grok 和 xAI 训练/推理需求背后的超大 GPU 数据中心域，包含 Colossus/Macrohard、GPU/ASIC rack、电力、液冷、网络和储能。它不是单纯模型公司，而是把模型迭代速度绑定到实体算力基础设施的 AI factory。","role":"它的作用是为 Grok、X 平台和潜在企业/开发者业务提供可控算力，并形成 Musk 生态内部的数据、能源和算力闭环。","replaces":"它部分替代外租云算力依赖，但不会完全替代 NVIDIA、ODM、电力和冷却等外部供应链。"},"D5-N2-liquid-cooling":{"summary":"液冷 / 水资源是 xAI 高密度 GPU 集群的热管理层，包含 CDU、冷板、泵阀、管路、换热、水处理和机房运维。它不是普通空调，也不是单一冷板部件；它必须和整柜功率、PUE、水资源许可和维护流程一起设计。","role":"它的作用是让高功率 GPU rack 在长期满载下保持频率和可靠性。","replaces":"它部分替代传统风冷在高密度 AI 机柜中的主导位置。"},"D5-N3-power":{"summary":"电力 / Megapack 是 xAI AI 工厂从芯片采购走向基础设施建设的能源层，包含电网接入、储能、变压器、开关柜、临时供电和电力调度。它不是普通机房配电，而是数百 MW 到 GW 级负荷的系统工程。","role":"它的作用是把 GPU 集群变成可上电、可扩容、可持续运行的算力产能。","replaces":"它替代传统数据中心“先建机房再慢慢扩电”的节奏，变成 power-first 选址和建设。"},"D5-N3-S1-grid":{"summary":"电网接入是 AI 工厂获得新增负荷指标、变电站、输电线路和公用事业协调的基础设施层。它不是简单买电，而是审批、工程、设备交付和电网稳定性共同决定的硬约束。","role":"它的作用是决定 xAI campus 的上限功率和扩容时间表。","replaces":"它不替代储能或燃机，而是与它们配合，解决长期稳定供电。"},"D5-N3-S2-storage":{"summary":"Megapack 储能是 Tesla Energy 在 xAI/数据中心场景中可能承担的削峰、备电和过渡供电模块。它不是永久电网接入的完整替代品，而是提高供电弹性、缓冲负荷波动和等待并网期间的补充方案。","role":"它的作用是把 Tesla 能源业务和 xAI 算力需求连接起来，形成生态内交易和能源调度能力。","replaces":"它部分替代柴油备电和部分临时供电方案，但不能替代长期 PPA、变电站和电网扩容。"},"D5-N3-S3-transformer":{"summary":"大型变压器是把外部电网高压电转换成 AI 数据中心可使用电压等级的核心电力设备。它不是普通低压配电柜，交期、铜钢材料、绝缘、散热和认证决定大型负荷能否按期接入。","role":"它的作用是把电网容量真正接入机房，是 AI campus 电力瓶颈中最容易出现长交期的一层。","replaces":"它不替代储能或发电，而是电网接入路径上的必需设备。"},"D6-neuralink":{"summary":"Neuralink / 脑机接口是把柔性电极植入大脑、采集神经信号并通过芯片和软件解码意图的医疗硬科技域。它不是消费电子，也不是普通可穿戴设备，而是医疗器械、MEMS、电极材料、植入封装、手术机器人和临床监管的组合。","role":"它的作用是为瘫痪患者等人群恢复控制能力，并长期探索人机接口平台。","replaces":"它可能部分替代外部辅助输入设备和传统神经刺激/记录方案，但必须经过严格临床验证。"},"D7-boring":{"summary":"The Boring Company 是围绕低成本隧道掘进、Loop 交通和预制管片建设的地下基础设施公司。它不是普通轨交运营商，也不是单纯 TBM 制造商，而是把掘进设备、许可、土建、站点和运营模式打包成城市地下交通方案。","role":"它的作用是用更低成本和更快施工节奏拓展城市隧道和点到点交通。","replaces":"它部分替代传统高成本地铁/隧道建设方案中的某些短距离场景，但不替代完整城市公共交通系统。"},"D8-cross":{"summary":"跨域底座是 Musk 生态中最像“反卡脖子”的共享基础设施方向，覆盖 Terafab、自研芯片、能源储能、AI 算力、电力设备和制造自动化。它不是一个单独业务，而是 Tesla、SpaceX、xAI 等公司在芯片、能源和制造能力上向内收的长期路线。","role":"它的作用是降低对外部供应链的脆弱性，把关键能力变成生态内部可复用平台。","replaces":"它部分替代外部代工、外部云算力和外部能源供应依赖，但短期仍会和 NVIDIA、半导体设备、电池和电力供应链深度绑定。"}},"evidenceText":{"strong":"强证据","reported":"报道/披露","inferred":"推断","weak":"待核实"},"heatText":{"hot":"已拥挤","repricing":"重估中","underfollowed":"仍冷门","early":"过早"},"kindText":{"root":"生态","domain":"业务域","node":"节点","subnode":"子层"},"defaultSelected":"D1-starlink"}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
let selectedId = D.defaultSelected || 'root';
const byId = new Map(D.tree.map(n => [n.id,n]));
const childrenOf = id => D.tree.filter(n => n.parentId === id);
const detailFor = node => ({...node, ...(D.detailOverrides[node.id] || {})});
const chokeFor = node => node.heat === 'underfollowed' && node.evidence !== 'weak' ? '当下卡点' : node.heat === 'repricing' ? '候选卡点' : node.heat === 'hot' ? '已定价卡点' : '远期卡点';
const pillClass = v => String(v).startsWith('-') ? 'red' : String(v).startsWith('+') ? 'green' : '';
function pathTo(id){const out=[];let cur=byId.get(id);while(cur){out.unshift(cur);cur=cur.parentId?byId.get(cur.parentId):null}return out}
function related(node){return D.stockPerformance.filter(s => node.aShare && node.aShare.includes(s.name))}
function renderStats(){document.getElementById('stats').innerHTML=[['一级业务域',childrenOf('root').length],['已拆节点',D.tree.filter(n=>n.kind==='node'||n.kind==='subnode').length],['仍冷门节点',D.tree.filter(n=>n.heat==='underfollowed').length],['行情口径','新浪日K未复权']].map(([k,v])=>'<div class="stat"><b>'+v+'</b><span>'+k+'</span></div>').join('')}
function renderTreeNode(node, depth=0){const kids=childrenOf(node.id);const active=node.id===selectedId;return '<button class="nodeBtn '+(active?'active':'')+'" style="padding-left:'+(10+depth*18)+'px" data-id="'+node.id+'"><div class="nodeLine"><span class="label">'+node.label+'</span><span class="pill">'+(D.kindText[node.kind]||node.kind)+'</span><span class="pill">'+(D.heatText[node.heat]||node.heat)+'</span><span class="pill">'+(D.evidenceText[node.evidence]||node.evidence)+'</span><span class="pill">'+chokeFor(node)+'</span></div></button>'+kids.map(k=>renderTreeNode(k,depth+1)).join('')}
function renderTree(){document.getElementById('tree').innerHTML=renderTreeNode(byId.get('root'));document.querySelectorAll('.nodeBtn').forEach(b=>b.onclick=()=>{selectedId=b.dataset.id;renderTree();renderDetail();})}
function sec(title, body){return '<div class="section"><h3>'+title+'</h3><p>'+body+'</p></div>'}
function renderDetail(){const node=byId.get(selectedId)||D.tree[0];const d=detailFor(node);const stocks=related(node);let html='<div class="section"><p class="path">'+pathTo(node.id).map(n=>n.label).join(' / ')+'</p><h2>'+node.label+'</h2><p class="path">'+node.id+' · '+node.kind+'</p></div>';html+=sec('它是什么',d.summary||'');if(d.role)html+=sec('它的作用',d.role);if(d.replaces)html+=sec('替代 / 补充谁',d.replaces);html+=sec('为什么可能卡脖子',node.why||'');html+=sec('海外 / 私有标的',node.companies||'');html+=sec('A股 / 港股映射',node.aShare||'');if(stocks.length){html+='<div class="section"><h3>关联A股近期涨跌幅</h3><p class="path">3个月、半年、1年为最新交易日相对对应日附近收盘价涨跌幅；数据源为新浪日 K，未复权。</p><div class="stocks">'+stocks.map(s=>'<div class="stock"><span class="stockName">'+s.name+' '+s.code+'</span><span class="pill '+pillClass(s.m3)+'">3个月 '+s.m3+'</span><span class="pill '+pillClass(s.m6)+'">半年 '+s.m6+'</span><span class="pill '+pillClass(s.y1)+'">1年 '+s.y1+'</span><span class="path">截至 '+s.asOf+' · '+s.source+'</span></div>').join('')+'</div></div>'}html+=sec('怎么验证',node.verify||'');if(node.source)html+=sec('来源与证据等级',node.source);if(node.falsification)html+=sec('证伪条件',node.falsification);const kids=childrenOf(node.id);if(kids.length){html+='<div class="section"><h3>下一层</h3><div class="children">'+kids.map(k=>'<button data-child="'+k.id+'">'+k.label+'</button>').join('')+'</div></div>'}document.getElementById('detail').innerHTML=html;document.querySelectorAll('[data-child]').forEach(b=>b.onclick=()=>{selectedId=b.dataset.child;renderTree();renderDetail();})}
renderStats();renderTree();renderDetail();
</script>
</body>
</html>
